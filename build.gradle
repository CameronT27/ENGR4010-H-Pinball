plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.4.3'
def lwjglNatives = {
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()

    if (osName.contains('mac')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'natives-macos-arm64'
        }
        if (osArch.contains('amd64') || osArch.contains('x86_64')) {
            return 'natives-macos'
        }
    }
    if (osName.contains('win')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'natives-windows-arm64'
        }
        if (osArch.contains('x86') || osArch.contains('i386')) {
            return 'natives-windows-x86'
        }
        if (osArch.contains('amd64') || osArch.contains('x86_64')) {
            return 'natives-windows'
        }
    }
    if (osName.contains('linux')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'natives-linux-arm64'
        }
        if (osArch.contains('arm')) {
            return 'natives-linux-arm32'
        }
        if (osArch.contains('ppc64le')) {
            return 'natives-linux-ppc64le'
        }
        if (osArch.contains('riscv64')) {
            return 'natives-linux-riscv64'
        }
        if (osArch.contains('amd64') || osArch.contains('x86_64')) {
            return 'natives-linux'
        }
    }
    if (osName.contains('freebsd')) {
        return 'natives-freebsd'
    }
    throw new GradleException("Unsupported operating system: ${osName} ${osArch}")
}()

dependencies {
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"

    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:${lwjglNatives}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'Main'
}

tasks.named('run', JavaExec).configure {
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('packageApp', Exec) {
    dependsOn tasks.named('installDist')

    doFirst {
        def osName = System.getProperty('os.name').toLowerCase()
        def packageType = osName.contains('mac') ? 'dmg' : osName.contains('win') ? 'exe' : 'app-image'
        def inputDirectory = layout.buildDirectory.dir('install/OnlinePinball/lib').get().asFile
        def outputDirectory = layout.buildDirectory.dir('jpackage').get().asFile

        delete outputDirectory

        def jpackageArguments = [
                '--type', packageType,
                '--input', inputDirectory.absolutePath,
                '--dest', outputDirectory.absolutePath,
                '--name', 'OnlinePinball',
                '--main-jar', 'OnlinePinball.jar',
                '--main-class', 'Main',
                '--app-version', '1.0.0'
        ]
        if (osName.contains('mac')) {
            jpackageArguments += ['--java-options', '-XstartOnFirstThread']
        }
        if (osName.contains('win')) {
            jpackageArguments += ['--win-dir-chooser', '--win-menu', '--win-shortcut', '--win-shortcut-prompt' /*, '--win-console']*/]
        }

        commandLine(['jpackage'] + jpackageArguments)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
